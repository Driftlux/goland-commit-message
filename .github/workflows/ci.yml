name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 04:00（北京时间）校验一次与最新推荐 IDE 构建的二进制兼容性。
    - cron: "0 20 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build plugin
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPluginProjectConfiguration
      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error

  verify:
    # 二进制兼容性校验需要下载完整 IDE，只在主干和定时任务上运行，避免拖慢 PR。
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify binary compatibility
        run: ./gradlew buildPlugin verifyPlugin
